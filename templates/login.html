{% extends 'base.html' %}
{% block title %}Login - Skill Swap Hub{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center form-container">
<div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md bg-opacity-50 backdrop-filter backdrop-blur-md">
        <div class="text-center mb-8">
                <a href="{% url 'index' %}" class="text-3xl font-bold text-[#4f46e5]"><i class="fas fa-people-arrows mr-2"></i>Skill Swap Hub</a>
            <p class="text-gray-500 mt-2">Sign in to continue</p>
        </div>
        
        <!-- Display Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 text-sm text-red-700 bg-red-100 rounded-lg" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'login' %}" method="POST">
            {% csrf_token %} <!-- IMPORTANT for security -->
            <div class="mb-6">
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" name="username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4f46e5]" required>
            </div>
            <div class="mb-8">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4f46e5]" required>
            </div>
            <button type="submit" class="w-full btn-primary text-white py-3 rounded-lg font-semibold text-lg">Login</button>
        </form>
        <div class="text-center mt-6">
            <p class="text-gray-600">Don't have an account? <a href="{% url 'register' %}" class="text-[#4f46e5] hover:underline font-semibold">Register now</a></p>
        </div>
    </div>
</div>
{% endblock %}
