{% extends 'base.html' %}
{% block title %}Add Skill - Skill Swap Hub{% endblock %}

{% block content %}
<div class="relative min-h-screen md:flex">
    <div id="sidebar" class="sidebar bg-white absolute inset-y-0 left-0 transform md:relative md:translate-x-0 sidebar-closed md:flex md:flex-col md:justify-between shadow-lg z-30">
        <div>
            <div class="logo-section">
                <a href="{% url 'index' %}" class="sidebar-logo-link inline-flex flex-col items-center justify-center w-full">
                    <i class="fas fa-people-arrows text-4xl text-[#4f46e5]"></i>
                    <span class="sidebar-text block text-xl font-bold text-[#4f46e5] mt-2">Skill Swap Hub</span>
                </a>
            </div>
            <nav class="mt-4 px-4">
                <a href="{% url 'dashboard' %}" class="sidebar-nav-link"><i class="fas fa-tachometer-alt fa-fw"></i> <span class="sidebar-text ml-3">Dashboard</span></a>
                <a href="{% url 'add_skill' %}" class="sidebar-nav-link active"><i class="fas fa-plus-circle fa-fw"></i> <span class="sidebar-text ml-3">Add Skill</span></a>
                <a href="{% url 'listings' %}" class="sidebar-nav-link"><i class="fas fa-list-alt fa-fw"></i> <span class="sidebar-text ml-3">All Skills</span></a>
                <a href="{% url 'profile' %}" class="sidebar-nav-link"><i class="fas fa-user fa-fw"></i> <span class="sidebar-text ml-3">My Profile</span></a>
            </nav>
        </div>
        <div class="p-4">
            <button id="desktop-sidebar-toggle" class="hidden md:block w-full text-center p-2 bg-gray-100 hover:bg-gray-200 rounded-lg mb-2 text-[#4f46e5]"><i class="fas fa-angle-left transition-transform duration-300"></i></button>
            <a href="{% url 'logout' %}" class="sidebar-nav-link"><i class="fas fa-sign-out-alt fa-fw"></i> <span class="sidebar-text ml-3">Logout</span></a>
        </div>
    </div>

    <main id="main-content" class="flex-1 py-6 px-8 md:py-10 md:px-12">
        <h1 class="text-3xl font-bold mb-8">Add a New Skill</h1>
        <div class="bg-white p-8 rounded-xl shadow-md max-w-2xl mx-auto">
            <form action="{% url 'add_skill' %}" method="POST">
                {% csrf_token %}
                <div class="mb-6">
                    <label for="skill_name" class="block text-gray-700 text-sm font-bold mb-2">Skill Name</label>
                    <input type="text" id="skill_name" name="skill_name" placeholder="e.g., Python Programming" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4f46e5]" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Skill Type</label>
                    <div class="mt-2 flex space-x-4">
                        <label class="inline-flex items-center">
                            <input type="radio" name="skill_type" value="offer" class="form-radio text-[#4f46e5]" required>
                            <span class="ml-2 text-gray-700">I can teach this skill</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="radio" name="skill_type" value="request" class="form-radio text-[#4f46e5]" required>
                            <span class="ml-2 text-gray-700">I want to learn this skill</span>
                        </label>
                    </div>
                </div>
                <div class="mb-8">
                    <label for="description" class="block text-gray-700 text-sm font-bold mb-2">Description</label>
                    <textarea id="description" name="description" rows="5" placeholder="Describe your skill or what you want to learn..." class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#4f46e5]" required></textarea>
                </div>
                <button type="submit" class="w-full btn-primary text-white py-3 rounded-lg font-semibold text-lg">Submit Skill</button>
            </form>
        </div>
    </main>
</div>
{% endblock %}
